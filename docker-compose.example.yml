services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - "3000:3000"
    entrypoint: ["/bin/sh", "/usr/local/bin/entrypoint-patch.sh"]
    volumes:
      - ./config:/app/config:z
      # Dynamic in-container patcher (patches Next.js at boot; survives image auto-updates!)
      - ./entrypoint-patch.sh:/usr/local/bin/entrypoint-patch.sh:ro,z
    # Store secrets in config/.env (copy config/.env.example to config/.env)
    env_file:
      - ./config/.env
    environment:
      - PORT=3000
      # Restrict allowed hosts to your LAN IP / dashboard hostname (leave commented for default)
      # - HOMEPAGE_ALLOWED_HOSTS=192.168.1.100,localhost,127.0.0.1
    restart: always

